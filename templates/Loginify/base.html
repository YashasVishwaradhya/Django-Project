{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Login System{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{% url 'login' %}">Login System</a>
    <nav aria-label="Main navigation">
      <a href="{% url 'signup' %}">Sign up</a>
      <a href="{% url 'login' %}">Log in</a>
      <a href="{% url 'hello' %}">Hello endpoint</a>
    </nav>
  </header>
  <main class="page-card">
    {% if messages %}
      <ul class="messages" aria-live="polite">
        {% for message in messages %}<li class="{{ message.tags }}">{{ message }}</li>{% endfor %}
      </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  <footer>Practice project built with Django templates and SQLite.</footer>
</body>
</html>
